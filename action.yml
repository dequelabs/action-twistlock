name: Twistlock
description: Temporarily a no-op while a replacement for Twistlock is set up. Inputs are kept for interface compatibility but unused.

inputs:
  tl-username:
    description: The username
    required: true
  tl-password:
    description: The password
    required: true
  tl-console-url:
    description: The console URL (eg https://console.your-company.org:8083)
    required: true
  tl-cli-version:
    description: The version of the twistlock cli
    required: true
    default: v1
  docker-image:
    description: The name of the Docker image.
    required: true

runs:
  using: composite
  steps:
    - name: Skip Twistlock scan
      shell: bash
      run: echo "action-twistlock is temporarily a no-op while a replacement for Twistlock is set up."
